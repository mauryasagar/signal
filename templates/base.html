<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Signal — Find Your Next Video{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
    media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  </noscript>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      const stored = localStorage.getItem("theme");
      document.documentElement.setAttribute("data-theme", stored || "dark");
    })();
  </script>
</head>

<body>
  <nav class="navbar">
    <a href="{{ url_for('landing') }}" class="nav-brand">
      <span class="dot"></span> Signal
    </a>
    <div class="nav-links">
      <a href="{{ url_for('landing') }}">Home</a>
      <a href="https://github.com/mauryasagar/signal" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ url_for('about') }}">About</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4.5" />
          <path
            d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55"
            stroke-linecap="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 14.3A8.3 8.3 0 1 1 9.7 4a6.6 6.6 0 0 0 10.3 10.3z" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </nav>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span class="footer-left"><a href="{{ url_for('landing') }}">Signal</a> <span class="footer-sep">&mdash;</span> <a href="https://www.wemakedevs.org/hackathons/zerops" target="_blank" rel="noopener">Zerops Challenge</a> <span class="footer-sep">&middot;</span> <a href="https://www.wemakedevs.org/" target="_blank" rel="noopener">WeMakeDevs</a> 2026</span>
    <div class="footer-links">
      {% block footer_link %}{% endblock %}
      {% block footer_sep %}{% endblock %}
      <a href="https://github.com/mauryasagar/signal" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep">&middot;</span>
      <a href="{{ url_for('about') }}">About</a>
    </div>
  </footer>

  <div class="loading-overlay" id="loading-overlay">
    <div class="radar">
      <div class="radar-ring radar-ring-1"></div>
      <div class="radar-ring radar-ring-2"></div>
      <div class="radar-ring radar-ring-3"></div>
      <div class="radar-sweep"></div>
      <div class="radar-dot"></div>
    </div>
    <p id="loading-text">SCANNING TREND SIGNALS…</p>
  </div>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
