zerops:
  - setup: signal
    build:
      base: python@3.12
      buildCommands:
        - pip install --upgrade pip
        - pip install -r requirements.txt
      deployFiles:
        - app.py
        - report.py
        - fetch_trends.py
        - generate_topics.py
        - cache.py
        - requirements.txt
        - templates
        - static
    run:
      base: python@3.12
      prepareCommands:
        - pip install --upgrade pip
        - pip install -r requirements.txt
      ports:
        - port: 8000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8000
          path: /health
      start: gunicorn app:app --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -